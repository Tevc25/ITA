name: Rezervacije Parkiranja CI

on:
  push:
    paths:
      - 'rezervacije-parkiranja/**'
      - '.github/workflows/rezervacije-parkiranja-ci.yml'
  pull_request:
    paths:
      - 'rezervacije-parkiranja/**'
      - '.github/workflows/rezervacije-parkiranja-ci.yml'

jobs:
  unit-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rezervacije-parkiranja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rezervacije-parkiranja/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
