name: ita

services:
  activemq:
    image: rmohr/activemq:5.15.9
    container_name: ita-activemq
    restart: unless-stopped
    ports:
      - "61613:61613"
      - "61616:61616"
      - "8161:8161"
    environment:
      ACTIVEMQ_ADMIN_LOGIN: ${ACTIVEMQ_ADMIN_LOGIN:-admin}
      ACTIVEMQ_ADMIN_PASSWORD: ${ACTIVEMQ_ADMIN_PASSWORD:-admin}
    networks:
      - ita_net

  uporabniki:
    build:
      context: ./uporabniki
      dockerfile: Dockerfile
    container_name: ita-uporabniki
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SQLITE_PATH: /app/data/users.sqlite
      PORT: 3000
    volumes:
      - uporabniki_data:/app/data
    networks:
      - ita_net
  parkirisca:
    build:
      context: ./parkirisca
      dockerfile: Dockerfile
    container_name: ita-parkirisca
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      GRPC_PORT: 50051
      HTTP_PORT: 8080
      DB_PATH: /app/data/parkirisca.db
    volumes:
      - parkirisca_data:/app/data
    networks:
      - ita_net

  rezervacije-parkiranja:
    build:
      context: ./rezervacije-parkiranja
      dockerfile: Dockerfile
    container_name: ita-rezervacije-parkiranja
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: rezervacije-parkiranja
      PORT: 8000
      DATABASE_URL: sqlite+aiosqlite:////app/data/reservations.db
      BROKER_ENABLED: "true"
      BROKER_REQUIRED: "true"
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_PORT: 61613
      ACTIVEMQ_USER: ${ACTIVEMQ_ADMIN_LOGIN:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_ADMIN_PASSWORD:-admin}
      ACTIVEMQ_DESTINATION: /topic/reservations.events
    depends_on:
      - activemq
    volumes:
      - rezervacije_data:/app/data
    networks:
      - ita_net

  gateway-web:
    build:
      context: ./gateway-web
      dockerfile: Dockerfile
    container_name: ita-gateway-web
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      APP_NAME: gateway-web
      PORT: 8090
      UPORABNIKI_BASE_URL: http://uporabniki:3000
      PARKIRISCA_BASE_URL: http://parkirisca:8080
      REZERVACIJE_BASE_URL: http://rezervacije-parkiranja:8000
      GATEWAY_MOBILE_BASE_URL: http://gateway-mobile:8091
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 3
      CIRCUIT_BREAKER_RECOVERY_TIMEOUT_SECONDS: 15
    depends_on:
      - uporabniki
      - parkirisca
      - rezervacije-parkiranja
    networks:
      - ita_net

  gateway-mobile:
    build:
      context: ./gateway-mobile
      dockerfile: Dockerfile
    container_name: ita-gateway-mobile
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      APP_NAME: gateway-mobile
      PORT: 8091
      UPORABNIKI_BASE_URL: http://uporabniki:3000
      PARKIRISCA_BASE_URL: http://parkirisca:8080
      REZERVACIJE_BASE_URL: http://rezervacije-parkiranja:8000
    depends_on:
      - uporabniki
      - parkirisca
      - rezervacije-parkiranja
    networks:
      - ita_net

  spletni-vmesnik:
    build:
      context: ./spletni-vmesnik
      dockerfile: Dockerfile
    container_name: ita-spletni-vmesnik
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - gateway-web
    networks:
      - ita_net

volumes:
  uporabniki_data:
  parkirisca_data:
  rezervacije_data:

networks:
  ita_net:
    driver: bridge
