name: Uporabniki CI

on:
  push:
    paths:
      - 'uporabniki/**'
      - '.github/workflows/uporabniki-ci.yml'
  pull_request:
    paths:
      - 'uporabniki/**'
      - '.github/workflows/uporabniki-ci.yml'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uporabniki
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: uporabniki/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
