name: Parkirisca CI

on:
  push:
    paths:
      - 'parkirisca/**'
      - '.github/workflows/parkirisca-ci.yml'
  pull_request:
    paths:
      - 'parkirisca/**'
      - '.github/workflows/parkirisca-ci.yml'

jobs:
  unit-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parkirisca

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v
