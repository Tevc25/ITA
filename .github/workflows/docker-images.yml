name: Docker Images

on:
  push:
    branches: ["main", "master"]
    paths:
      - "docker-compose.yml"
      - "parkirisca/**"
      - "rezervacije-parkiranja/**"
      - "uporabniki/**"
      - "gateway-web/**"
      - "gateway-mobile/**"
      - "spletni-vmesnik/**"
      - ".github/workflows/docker-images.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "parkirisca/**"
      - "rezervacije-parkiranja/**"
      - "uporabniki/**"
      - "gateway-web/**"
      - "gateway-mobile/**"
      - "spletni-vmesnik/**"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: parkirisca
            context: parkirisca
          - image: rezervacije-parkiranja
            context: rezervacije-parkiranja
          - image: uporabniki
            context: uporabniki
          - image: gateway-web
            context: gateway-web
          - image: gateway-mobile
            context: gateway-mobile
          - image: spletni-vmesnik
            context: spletni-vmesnik

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          tags: ita-${{ matrix.image }}:pr-${{ github.event.pull_request.number }}

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ita-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ita-${{ matrix.image }}:${{ github.sha }}
